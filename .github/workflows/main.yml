# This is the name of our workflow.
name: CI - Build and Push Docker Image

# This section defines the trigger.
on:
  push:
    branches: [ "main" ]

# Define environment variables
env:
  DOCKER_IMAGE_NAME: gpatil9/demand-forecasting-app 

# This section defines the jobs that will be executed.
jobs:
  # We have only one job now: to build and push the image.
  build-and-push:
    name: Build and Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:latest